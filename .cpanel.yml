---
# Run by cPanel Git Version Control on "Deploy HEAD Commit" (from the built `deploy` branch).
# Copies the site into public_html, leaving cPanel's own folders alone.
deployment:
  tasks:
    - export DEPLOYPATH=/home/alystevens/public_html/
    - if [ -x /usr/bin/rsync ]; then /usr/bin/rsync -a --delete --exclude '.git' --exclude '.cpanel.yml' --exclude '.nojekyll' --exclude '.well-known' --exclude 'cgi-bin' --exclude 'error_log' ./ $DEPLOYPATH; else tar -cf - --exclude='.git' --exclude='.cpanel.yml' --exclude='.nojekyll' . | tar -xf - -C $DEPLOYPATH; fi
